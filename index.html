<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ContaEC – Contabilidad para Ecuador</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#1e293b;--mu:#64748b;--pr:#1d4ed8;--pr2:#dbeafe;--bd:#e2e8f0;--ok:#15803d;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--pr:#60a5fa;--pr2:#1e3a5f;--bd:#334155;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--pr:#60a5fa;--pr2:#1e3a5f;--bd:#334155;--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#1e3a8a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
header b{font-size:18px}.demo{background:#fbbf24;color:#451a03;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);padding:6px}
nav button{white-space:nowrap;border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--pr2);color:var(--pr);font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:20px}
h2{margin:0 0 10px;font-size:17px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600}.n{text-align:right;font-variant-numeric:tabular-nums}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:14px;max-width:100%}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
.btn.g{background:var(--pr2);color:var(--pr)}.btn.r{background:none;color:var(--er);border:1px solid var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ok{color:var(--ok)}.er{color:var(--er)}.mu{color:var(--mu)}
.bar{height:16px;border-radius:4px;margin:3px 0}
</style></head><body>
<header><b>ContaEC · Contabilidad Ecuador</b><span id="demo"></span></header>
<nav id="nav"></nav>
<main id="v"></main>
<script>
const NAV=[["panel","Panel"],["nuevo","Nuevo asiento"],["ventas","Ventas"],["compras","Compras"],["inv","Inventario"],["mov","Ingresos y egresos"],["banco","Bancos y flujo"],["fin","Finanzas"],["pres","Presupuesto"],["ter","Clientes y proveedores"],["diario","Libro diario"],["mayor","Libro mayor"],["bc","Balance de comprobación"],["eeff","Estados financieros"],["plan","Plan de cuentas"],["ajustes","Ajustes"]];
const TIPOS={A:"Activo",P:"Pasivo",Pt:"Patrimonio",I:"Ingreso",G:"Gasto"};
const PLAN0=[["1.1.01","Caja","A"],["1.1.02","Bancos","A"],["1.1.03","Cuentas por cobrar clientes","A"],["1.1.04","Inventario de mercaderías","A"],["1.1.05","IVA crédito tributario","A"],["1.2.01","Muebles y equipos","A"],["2.1.01","Cuentas por pagar proveedores","P"],["2.1.02","IVA por pagar","P"],["2.1.03","Retenciones por pagar","P"],["3.1.01","Capital","Pt"],["3.1.02","Resultados acumulados","Pt"],["4.1.01","Ventas","I"],["4.1.02","Otros ingresos","I"],["5.1.01","Costo de ventas","G"],["5.2.01","Sueldos y salarios","G"],["5.2.02","Arriendo","G"],["5.2.03","Servicios básicos","G"],["5.2.04","Otros gastos","G"]];
let S={demo:false,iva:15,plan:PLAN0.map(a=>({c:a[0],n:a[1],t:a[2]})),as:[],cerrado:""};
try{const x=localStorage.getItem("contaec");if(x)S=JSON.parse(x)}catch(e){}
S.pres=S.pres||{};S.conc=S.conc||{};S.ext=S.ext||0;S.ter=S.ter||[];S.prod=S.prod||[];S.docs=S.docs||[];
const save=()=>{try{localStorage.setItem("contaec",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const m=n=>"$"+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const nm=c=>{const a=S.plan.find(x=>x.c===c);return a?a.c+" "+a.n:c};
const r2=n=>Math.round(n*100)/100;
let tab="panel",draft=[],dh="",mc="";
function saldos(){const o={};S.plan.forEach(a=>o[a.c]={d:0,h:0,a});S.as.forEach(e=>e.l.forEach(l=>{if(o[l.c]){o[l.c].d+=l.d;o[l.c].h+=l.h}}));return o}
const nat=a=>(a.t==="A"||a.t==="G")?1:-1;
const sal=x=>nat(x.a)*(x.d-x.h);
function nav(){$("nav").innerHTML=NAV.map(n=>`<button class="${tab===n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("");$("demo").innerHTML=S.demo?'<span class="demo">DATOS DE DEMOSTRACIÓN</span>':""}
function go(t){tab=t;render()}
function render(){nav();$("v").innerHTML=V[tab]();if(tab==="nuevo")drawDraft()}
const V={
panel(){const s=saldos(),g=t=>Object.values(s).filter(x=>x.a.t===t).reduce((a,x)=>a+sal(x),0);
const caja=sal(s["1.1.01"])+sal(s["1.1.02"]),ing=g("I"),gas=g("G"),u=ing-gas,mx=Math.max(ing,gas,1);
return`<div class="grid"><div class="card kpi"><small>Ingresos</small><b>${m(ing)}</b></div><div class="card kpi"><small>Gastos</small><b>${m(gas)}</b></div><div class="card kpi"><small>${u>=0?"Utilidad":"Pérdida"}</small><b class="${u>=0?"ok":"er"}">${m(u)}</b></div><div class="card kpi"><small>Caja y bancos</small><b>${m(caja)}</b></div><div class="card kpi"><small>Por cobrar</small><b>${m(sal(s["1.1.03"]))}</b></div><div class="card kpi"><small>Por pagar</small><b>${m(sal(s["2.1.01"]))}</b></div><div class="card kpi"><small>IVA por pagar − crédito</small><b>${m(sal(s["2.1.02"])-sal(s["1.1.05"]))}</b></div></div>
<div class="card"><h2>Ingresos vs gastos</h2><div class="mu">Ingresos</div><div class="bar" style="width:${ing/mx*100}%;background:var(--ok)"></div><div class="mu">Gastos</div><div class="bar" style="width:${gas/mx*100}%;background:var(--er)"></div></div>
<div class="card mu">${S.as.length?S.as.length+" asientos registrados.":"Aún no hay asientos. Registra el primero en «Nuevo asiento» o carga datos de demostración en «Ajustes»."}</div>`},
nuevo(){const op=S.plan.map(a=>`<option value="${a.c}">${a.c} ${a.n}</option>`).join("");
return`<div class="card"><h2>Asistente de asiento</h2><p class="mu">Elige la operación; se propone el asiento y tú lo revisas antes de confirmar. Nada se registra sin tu autorización.</p>
<div class="row"><select id="op"><option value="compra">Compra de mercadería</option><option value="venta">Venta</option><option value="gasto">Gasto</option><option value="cobro">Cobro a cliente</option><option value="pago">Pago a proveedor</option></select>
<input id="mb" type="number" step="0.01" placeholder="Valor sin IVA" style="width:140px">
<select id="fp"><option value="c">Contado (Caja)</option><option value="b">Bancos</option><option value="k">A crédito</option></select>
<label class="mu">IVA <input id="iv" type="number" value="${S.iva}" style="width:60px">%</label>
<button class="btn" onclick="sugerir()">Sugerir asiento</button></div><div id="why" class="mu"></div></div>
<div class="card"><h2>Asiento (editable)</h2><div class="row"><input id="fe" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="ds" placeholder="Descripción" style="flex:1;min-width:180px" value="${dh}"></div>
<div class="tw"><table><thead><tr><th>Cuenta</th><th>Debe</th><th>Haber</th><th></th></tr></thead><tbody id="dl"></tbody></table></div>
<div class="row" style="margin-top:8px"><button class="btn g" onclick="addL()">+ Línea</button><span id="cu"></span><button class="btn" onclick="confirmar()">Confirmar y registrar</button></div></div>`},
diario(){if(!S.as.length)return'<div class="card mu">Sin asientos.</div>';
return`<div class="card"><h2>Libro diario</h2><div class="tw"><table><thead><tr><th>Fecha</th><th>N.º</th><th>Descripción / Cuenta</th><th class="n">Debe</th><th class="n">Haber</th></tr></thead><tbody>${S.as.map(e=>`<tr style="background:var(--pr2)"><td>${e.f}</td><td>${String(e.n).padStart(5,"0")}</td><td colspan="2"><b>${e.ds||"—"}</b></td><td class="n"><button class="btn r" style="padding:2px 8px" onclick="anular(${e.n})">Anular</button></td></tr>`+e.l.map(l=>`<tr><td></td><td></td><td>${l.h?"&nbsp;&nbsp;&nbsp;&nbsp;":""}${nm(l.c)}</td><td class="n">${l.d?m(l.d):""}</td><td class="n">${l.h?m(l.h):""}</td></tr>`).join("")).join("")}</tbody></table></div></div>`},
mayor(){const sel=`<select onchange="mc=this.value;render()"><option value="">Selecciona una cuenta…</option>${S.plan.map(a=>`<option value="${a.c}" ${a.c===mc?"selected":""}>${a.c} ${a.n}</option>`).join("")}</select>`;
let t="";if(mc){const a=S.plan.find(x=>x.c===mc);let sd=0;const rows=[];S.as.forEach(e=>e.l.filter(l=>l.c===mc).forEach(l=>{sd+=nat(a)*(l.d-l.h);rows.push(`<tr><td>${e.f}</td><td>${String(e.n).padStart(5,"0")}</td><td>${e.ds||""}</td><td class="n">${l.d?m(l.d):""}</td><td class="n">${l.h?m(l.h):""}</td><td class="n">${m(sd)}</td></tr>`)}));
t=`<div class="tw"><table><thead><tr><th>Fecha</th><th>N.º</th><th>Descripción</th><th class="n">Debe</th><th class="n">Haber</th><th class="n">Saldo</th></tr></thead><tbody>${rows.join("")||'<tr><td colspan="6" class="mu">Sin movimientos</td></tr>'}</tbody></table></div>`}
return`<div class="card"><h2>Libro mayor</h2><div class="row">${sel}</div>${t}</div>`},
bc(){const s=Object.values(saldos()).filter(x=>x.d||x.h);let D=0,H=0;
const rows=s.map(x=>{D+=x.d;H+=x.h;return`<tr><td>${x.a.c}</td><td>${x.a.n}</td><td class="n">${m(x.d)}</td><td class="n">${m(x.h)}</td><td class="n">${m(Math.max(x.d-x.h,0))}</td><td class="n">${m(Math.max(x.h-x.d,0))}</td></tr>`}).join("");
const ok=r2(D)===r2(H);
return`<div class="card"><h2>Balance de comprobación</h2><div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th class="n">Debe</th><th class="n">Haber</th><th class="n">Saldo deudor</th><th class="n">Saldo acreedor</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="mu">Sin movimientos</td></tr>'}<tr><th colspan="2">Totales</th><th class="n">${m(D)}</th><th class="n">${m(H)}</th><th></th><th></th></tr></tbody></table></div><p class="${ok?"ok":"er"}">${ok?"✔ Los libros cuadran (Debe = Haber).":"✘ Descuadre de "+m(Math.abs(D-H))}</p></div>`},
eeff(){const s=Object.values(saldos());const L=t=>s.filter(x=>x.a.t===t&&(x.d||x.h));const T=t=>L(t).reduce((a,x)=>a+sal(x),0);
const sec=(t,tt)=>`<h2>${tt}</h2><table>${L(t).map(x=>`<tr><td>${x.a.n}</td><td class="n">${m(sal(x))}</td></tr>`).join("")}<tr><th>Total</th><th class="n">${m(T(t))}</th></tr></table>`;
const u=T("I")-T("G");
return`<div class="card">${sec("I","Estado de resultados · Ingresos")}${sec("G","Gastos")}<h2 class="${u>=0?"ok":"er"}">${u>=0?"Utilidad":"Pérdida"} del período: ${m(u)}</h2></div>
<div class="card">${sec("A","Estado de situación financiera · Activos")}${sec("P","Pasivos")}${sec("Pt","Patrimonio")}<table><tr><td>Resultado del período</td><td class="n">${m(u)}</td></tr><tr><th>Pasivo + Patrimonio + Resultado</th><th class="n">${m(T("P")+T("Pt")+u)}</th></tr></table><p class="${r2(T("A"))===r2(T("P")+T("Pt")+u)?"ok":"er"}">${r2(T("A"))===r2(T("P")+T("Pt")+u)?"✔ Activo = Pasivo + Patrimonio":"✘ La ecuación contable no cuadra"}</p></div>`},
plan(){return`<div class="card"><h2>Plan de cuentas</h2><div class="row"><input id="pc" placeholder="Código" style="width:90px"><input id="pn" placeholder="Nombre" style="flex:1;min-width:140px"><select id="pt">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><button class="btn" onclick="addCta()">Agregar</button></div><div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th>Tipo</th></tr></thead><tbody>${S.plan.map(a=>`<tr><td>${a.c}</td><td>${a.n}</td><td>${TIPOS[a.t]}</td></tr>`).join("")}</tbody></table></div></div>`},
ventas(){return V.docs("venta")},compras(){return V.docs("compra")},
docs(tipo){const v=tipo==="venta",ter=S.ter.filter(x=>x.t===(v?"c":"p")),L=S.docs.filter(d=>d.tipo===tipo).slice().reverse(),hoy=new Date().toISOString().slice(0,10);
const tn=id=>(S.ter.find(x=>x.id==id)||{}).n||"—",pn=id=>(S.prod.find(x=>x.id==id)||{}).n||"—";
if(!ter.length||!S.prod.length)return`<div class="card">Primero crea al menos un ${v?"cliente":"proveedor"} y un producto en «Clientes y proveedores» e «Inventario».</div>`;
const T=L.reduce((a,d)=>a+d.b,0),I=L.reduce((a,d)=>a+d.iv,0),P=L.reduce((a,d)=>a+pend(d),0);
return`<div class="card"><h2>${v?"Registrar venta":"Registrar compra"}</h2><div class="row"><input id="dfe" type="date" value="${hoy}"><select id="dt">${ter.map(x=>`<option value="${x.id}">${x.n}</option>`).join("")}</select><select id="dp">${S.prod.map(x=>`<option value="${x.id}">${x.n}</option>`).join("")}</select><input id="dq" type="number" placeholder="Cantidad" style="width:90px"><input id="du" type="number" step="0.01" placeholder="Precio unit. sin IVA" style="width:130px"><select id="df"><option value="c">Contado (Caja)</option><option value="b">Bancos</option><option value="k">A crédito</option></select><label class="mu">Vence <input id="dv" type="date"></label><button class="btn" onclick="regDoc('${tipo}')">Registrar</button></div><p class="mu">Genera el asiento automáticamente tras tu confirmación. Un producto por documento en esta fase.</p></div>
<div class="card"><h2>Historial</h2><p>Base ${m(T)} · IVA ${m(I)} · Pendiente ${m(P)}</p><div class="tw"><table><thead><tr><th>Fecha</th><th>${v?"Cliente":"Proveedor"}</th><th>Producto</th><th class="n">Cant.</th><th class="n">Total</th><th class="n">Pendiente</th><th>Vence</th><th></th></tr></thead><tbody>${L.map(d=>{const p=pend(d),ve=p>0&&d.venc&&d.venc<hoy;return`<tr><td>${d.f}</td><td>${tn(d.ter)}</td><td>${pn(d.p)}</td><td class="n">${d.q}</td><td class="n">${m(d.t)}</td><td class="n ${p>0?"er":"ok"}">${m(p)}</td><td class="${ve?"er":""}">${d.venc||""}${ve?" ⚠ vencida":""}</td><td>${p>0?`<button class="btn g" style="padding:2px 8px" onclick="abonar(${d.id})">${v?"Cobrar":"Pagar"}</button>`:""}</td></tr>`}).join("")||'<tr><td colspan="8" class="mu">Sin registros</td></tr>'}</tbody></table></div></div>`},
inv(){const o=Object.values(inv());return`<div class="card"><h2>Nuevo producto</h2><div class="row"><input id="pn2" placeholder="Nombre" style="flex:1;min-width:140px"><input id="pv2" type="number" step="0.01" placeholder="Precio venta" style="width:110px"><input id="pm2" type="number" placeholder="Mínimo" value="5" style="width:80px"><button class="btn" onclick="addProd()">Agregar</button></div></div><div class="card"><h2>Inventario (costo promedio)</h2><div class="tw"><table><thead><tr><th>Producto</th><th class="n">Stock</th><th class="n">Costo prom.</th><th class="n">Valor</th><th class="n">P. venta</th><th></th></tr></thead><tbody>${o.map(x=>`<tr><td>${x.p.n}</td><td class="n">${x.q}</td><td class="n">${m(x.q>0?x.v/x.q:0)}</td><td class="n">${m(x.v)}</td><td class="n">${m(x.p.pv||0)}</td><td class="er">${x.q<=(x.p.min||0)?"⚠ stock bajo":""}</td></tr>`).join("")||'<tr><td colspan="6" class="mu">Sin productos</td></tr>'}</tbody></table></div></div>${kardex()}`},
mov(){const M=S.as.filter(e=>e.mv).slice().reverse(),tot={};M.forEach(e=>{const v=e.l.reduce((a,l)=>a+l.d,0);tot[e.mv.c]=(tot[e.mv.c]||0)+v});
return`<div class="card"><h2>Registrar ingreso o egreso</h2><div class="row"><input id="mfe" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="mt" onchange="catSel()"><option value="i">Ingreso</option><option value="e">Egreso</option></select><select id="mcat">${CATS.i.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}</select><select id="mb"><option value="c">Caja</option><option value="b">Bancos</option></select><input id="mv" type="number" step="0.01" placeholder="Valor" style="width:100px"><input id="mor" placeholder="Origen / destino" style="width:150px"><input id="mco" placeholder="N.º comprobante" style="width:130px"><button class="btn" onclick="regMov()">Registrar</button></div><p class="mu">Genera el asiento tras tu confirmación. Para operaciones con IVA usa Compras, Ventas o un asiento manual.</p></div>
<div class="card"><h2>Por categoría</h2>${Object.entries(tot).map(([c,v])=>`<div class="row" style="justify-content:space-between"><span>${nm(c)}</span><b>${m(v)}</b></div>`).join("")||'<span class="mu">Sin movimientos</span>'}</div>
<div class="card"><h2>Movimientos</h2><div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th class="n">Valor</th></tr></thead><tbody>${M.map(e=>`<tr><td>${e.f}</td><td class="${e.mv.t==="i"?"ok":"er"}">${e.mv.t==="i"?"Ingreso":"Egreso"}</td><td>${e.ds}</td><td class="n">${m(e.l.reduce((a,l)=>a+l.d,0))}</td></tr>`).join("")||'<tr><td colspan="4" class="mu">Sin registros</td></tr>'}</tbody></table></div></div>`},
banco(){const mes={};S.as.slice().sort((a,b)=>a.f<b.f?-1:1).forEach(e=>e.l.forEach(l=>{if(l.c==="1.1.01"||l.c==="1.1.02"){const k=e.f.slice(0,7);mes[k]=mes[k]||{i:0,o:0};mes[k].i+=l.d;mes[k].o+=l.h}}));let ac=0;
const fl=Object.entries(mes).sort().map(([k,x])=>{ac+=x.i-x.o;return`<tr><td>${k}</td><td class="n ok">${m(x.i)}</td><td class="n er">${m(x.o)}</td><td class="n">${m(x.i-x.o)}</td><td class="n">${m(ac)}</td></tr>`}).join("");
const B=[];let lib=0,cn=0;S.as.forEach(e=>e.l.forEach((l,i)=>{if(l.c==="1.1.02"){const k=e.n+":"+i,ok=!!S.conc[k];lib+=l.d-l.h;if(ok)cn+=l.d-l.h;B.push(`<tr><td><input type="checkbox" ${ok?"checked":""} onchange="S.conc['${k}']=this.checked;save();render()"></td><td>${e.f}</td><td>${e.ds}</td><td class="n">${l.d?m(l.d):""}</td><td class="n">${l.h?m(l.h):""}</td></tr>`)}}));
const df=r2(S.ext-cn);
return`<div class="card"><h2>Flujo de efectivo (caja y bancos)</h2><div class="tw"><table><thead><tr><th>Mes</th><th class="n">Entradas</th><th class="n">Salidas</th><th class="n">Neto</th><th class="n">Saldo</th></tr></thead><tbody>${fl||'<tr><td colspan="5" class="mu">Sin movimientos</td></tr>'}</tbody></table></div></div>
<div class="card"><h2>Conciliación bancaria</h2><div class="row"><label>Saldo según extracto <input type="number" step="0.01" value="${S.ext}" style="width:120px" onchange="S.ext=+this.value;save();render()"></label></div><p>Saldo en libros: <b>${m(lib)}</b> · Conciliado: <b>${m(cn)}</b> · Diferencia: <b class="${df===0?"ok":"er"}">${m(df)}</b></p><p class="mu">Marca los movimientos que ya aparecen en tu extracto bancario.</p><div class="tw"><table><thead><tr><th></th><th>Fecha</th><th>Descripción</th><th class="n">Entrada</th><th class="n">Salida</th></tr></thead><tbody>${B.join("")||'<tr><td colspan="5" class="mu">Sin movimientos en Bancos</td></tr>'}</tbody></table></div></div>`},
